name: Build DailyFlow APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install unzip
      run: sudo apt-get update && sudo apt-get install -y unzip

    - name: Unzip Project
      run: |
        ls -la
        unzip -o DailyFlow-AndroidStudio.zip
        ls -la

    - name: Find gradlew and make executable
      run: find . -name "gradlew" -type f -exec chmod +x {} \;

    - name: Build Debug APK
      run: |
        cd $(find . -name "gradlew" -type f -exec dirname {} \; | head -n 1)
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DailyFlow-Debug-APK
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
