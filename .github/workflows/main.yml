name: Build DailyFlow APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project
      run: unzip DailyFlow-AndroidStudio.zip

    - name: Grant execute permission for gradlew
      run: find . -name "gradlew" -type f -exec chmod +x {} \;

    - name: Build Debug APK
      run: |
        PROJECT_DIR=$(find . -name "gradlew" -type f -exec dirname {} \; | head -n 1)
        cd $PROJECT_DIR
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DailyFlow-Debug-APK
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
