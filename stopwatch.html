<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کرنومتر</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#1e293b;border-bottom:1px solid rgba(255,255,255,.08);padding-top:calc(14px + env(safe-area-inset-top))}
.hdr h1{font-size:17px;font-weight:700}
.ibtn{background:none;border:none;color:#f1f5f9;font-size:20px;cursor:pointer;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ibtn:active{background:rgba(255,255,255,.08)}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.clock{font-size:62px;font-weight:200;font-family:'Courier New',monospace;letter-spacing:2px;direction:ltr;text-align:center;line-height:1;color:#f1f5f9}
.clock .ms{font-size:30px;color:#64748b}
.clock.running{color:#10b981}
.btns{display:flex;gap:14px;margin-top:36px;align-items:center}
.btn{width:88px;height:88px;border-radius:50%;border:none;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .15s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.btn:active{transform:scale(.92)}
.btn.start{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 8px 24px rgba(16,185,129,.4)}
.btn.pause{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 8px 24px rgba(245,158,11,.4)}
.btn.reset{background:linear-gradient(135deg,#64748b,#475569);width:68px;height:68px;font-size:13px}
.btn.lap{background:linear-gradient(135deg,#6366f1,#8b5cf6);width:68px;height:68px;font-size:13px}
.laps{flex:0 0 auto;max-height:38vh;overflow-y:auto;padding:0 20px 20px;max-width:600px;margin:0 auto;width:100%}
.lapRow{display:flex;justify-content:space-between;padding:12px 16px;background:#1e293b;border-radius:12px;margin-bottom:6px;font-size:14px;border:1px solid rgba(255,255,255,.05)}
.lapRow .n{color:#94a3b8;font-size:13px}
.lapRow .t{font-family:'Courier New',monospace;direction:ltr;color:#f1f5f9}
.lapRow.fast{border-color:rgba(16,185,129,.5)}
.lapRow.slow{border-color:rgba(239,68,68,.5)}
.empty{text-align:center;color:#64748b;font-size:13px;padding:20px}
</style>
</head>
<body>
<div class="hdr">
<button class="ibtn" onclick="location.href='index.html'">←</button>
<h1>⏱ کرنومتر</h1>
<button class="ibtn" onclick="resetAll()">🗑</button>
</div>
<div class="main">
<div class="clock" id="clock">00:00<span class="ms">.00</span></div>
<div class="btns">
<button class="btn reset" id="resetBtn" onclick="resetAll()" style="display:none">ریست</button>
<button class="btn start" id="mainBtn" onclick="toggle()">شروع</button>
<button class="btn lap" id="lapBtn" onclick="lap()" style="display:none">دور</button>
</div>
</div>
<div class="laps" id="laps">
<div class="empty">هنوز دوری ثبت نشده</div>
</div>
<script>
var startTime=0,elapsed=0,running=false,timer=null,laps=[],lastLapTime=0;
var clock=document.getElementById('clock');
var mainBtn=document.getElementById('mainBtn');
var lapBtn=document.getElementById('lapBtn');
var resetBtn=document.getElementById('resetBtn');
function fmt(ms){
var total=Math.floor(ms);
var h=Math.floor(total/3600000);
var m=Math.floor((total%3600000)/60000);
var s=Math.floor((total%60000)/1000);
var cs=Math.floor((total%1000)/10);
var str='';
if(h>0)str+=pad(h)+':';
str+=pad(m)+':'+pad(s);
return {main:str,ms:'.'+pad(cs)};
}
function pad(n){return n<10?'0'+n:''+n}
function update(){
var now=Date.now();
elapsed=now-startTime;
var f=fmt(elapsed);
clock.innerHTML=f.main+'<span class="ms">'+f.ms+'</span>';
}
function toggle(){
if(!running){
startTime=Date.now()-elapsed;
running=true;
timer=setInterval(update,30);
mainBtn.textContent='توقف';
mainBtn.className='btn pause';
lapBtn.style.display='flex';
resetBtn.style.display='flex';
clock.classList.add('running');
if(laps.length===0)lastLapTime=0;
}else{
running=false;
clearInterval(timer);
mainBtn.textContent='ادامه';
mainBtn.className='btn start';
clock.classList.remove('running');
}
}
function lap(){
if(!running)return;
var now=elapsed;
var diff=now-lastLapTime;
lastLapTime=now;
laps.push({n:laps.length+1,total:now,diff:diff});
renderLaps();
}
function resetAll(){
if(!running&&elapsed===0&&laps.length===0)return;
if(!confirm('ریست شود؟'))return;
running=false;
clearInterval(timer);
elapsed=0;startTime=0;laps=[];lastLapTime=0;
clock.innerHTML='00:00<span class="ms">.00</span>';
clock.classList.remove('running');
mainBtn.textContent='شروع';
mainBtn.className='btn start';
lapBtn.style.display='none';
resetBtn.style.display='none';
renderLaps();
}
function renderLaps(){
var c=document.getElementById('laps');
if(laps.length===0){c.innerHTML='<div class="empty">هنوز دوری ثبت نشده</div>';return}
var minDiff=Infinity,maxDiff=0;
for(var i=0;i<laps.length;i++){if(laps[i].diff<minDiff)minDiff=laps[i].diff;if(laps[i].diff>maxDiff)maxDiff=laps[i].diff}
var html='';
for(var i=laps.length-1;i>=0;i--){
var l=laps[i];
var cls='lapRow';
if(laps.length>1){
if(l.diff===minDiff)cls+=' fast';
else if(l.diff===maxDiff)cls+=' slow';
}
var d=fmt(l.diff);
html+='<div class="'+cls+'"><span class="n">دور '+l.n+'</span><span class="t">'+d.main+d.ms+'</span></div>';
}
c.innerHTML=html;
}
document.addEventListener('keydown',function(e){
if(e.code==='Space'){e.preventDefault();toggle()}
else if(e.code==='KeyL'){lap()}
else if(e.code==='KeyR'){resetAll()}
});
</script>
</body>
  </html>
