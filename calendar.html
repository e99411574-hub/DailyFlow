<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تقویم</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#1e293b;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:10;padding-top:calc(14px + env(safe-area-inset-top))}
.hdr h1{font-size:17px;font-weight:700}
.ibtn{background:none;border:none;color:#f1f5f9;font-size:20px;cursor:pointer;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ibtn:active{background:rgba(255,255,255,.08)}
.wrap{padding:16px;max-width:600px;margin:0 auto}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;background:#1e293b;border-radius:16px;padding:12px 16px;border:1px solid rgba(255,255,255,.08)}
.nav button{background:none;border:none;color:#818cf8;font-size:22px;cursor:pointer;width:40px;height:40px;border-radius:10px;font-weight:700}
.nav button:active{background:rgba(129,140,248,.15)}
.nav .ttl{text-align:center;flex:1}
.nav .ttl .m{font-size:18px;font-weight:700}
.nav .ttl .y{font-size:12px;color:#94a3b8;margin-top:2px}
.nav .ttl .today{font-size:11px;color:#94a3b8;margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.wd{text-align:center;font-size:12px;color:#94a3b8;padding:8px 0;font-weight:600}
.wd.fri{color:#f87171}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#1e293b;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;border:2px solid transparent;color:#f1f5f9}
.day.other{opacity:.25;cursor:default}
.day.today{border-color:#818cf8;background:linear-gradient(135deg,rgba(129,140,248,.3),rgba(167,139,250,.3));font-weight:700}
.day.fri{color:#f87171}
.day.holiday{color:#f87171}
.day:active:not(.other){transform:scale(.9)}
.events{margin-top:16px;background:#1e293b;border-radius:16px;padding:16px;border:1px solid rgba(255,255,255,.08)}
.events h3{font-size:14px;margin-bottom:10px;color:#94a3b8;font-weight:600}
.ev{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;align-items:center}
.ev:last-child{border-bottom:none}
.ev .dot{width:8px;height:8px;border-radius:50%;background:#818cf8;flex-shrink:0}
.ev .d{color:#94a3b8;font-size:11px;margin-right:auto}
.jumpBtn{width:100%;padding:12px;margin-top:14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="hdr">
<button class="ibtn" onclick="location.href='index.html'">←</button>
<h1>🗓 تقویم</h1>
<button class="ibtn" onclick="goToday()">📍</button>
</div>
<div class="wrap">
<div class="nav">
<button onclick="changeMonth(-1)">‹</button>
<div class="ttl">
<div class="m" id="mName">—</div>
<div class="y" id="yName">—</div>
<div class="today" id="todayInfo">—</div>
</div>
<button onclick="changeMonth(1)">›</button>
</div>
<div class="week">
<div class="wd">ش</div><div class="wd">ی</div><div class="wd">د</div><div class="wd">س</div><div class="wd">چ</div><div class="wd">پ</div><div class="wd fri">ج</div>
</div>
<div class="grid" id="grid"></div>
<div class="events">
<h3>📌 مناسبت‌های این ماه</h3>
<div id="events"></div>
</div>
<button class="jumpBtn" onclick="goToday()">📍 برو به امروز</button>
</div>
<script>
var J_MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var WEEK_DAYS=['شنبه','یک‌شنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'];

function g2j(gy,gm,gd){
var g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
var jy=(gy<=1600)?0:979;
gy-=(gy<=1600)?621:1600;
var gy2=(gm>2)?(gy+1):gy;
var days=(365*gy)+parseInt((gy2+3)/4)-parseInt((gy2+99)/100)+parseInt((gy2+399)/400)-80+gd+g_d_m[gm-1];
jy+=33*parseInt(days/12053);
days%=12053;
jy+=4*parseInt(days/1461);
days%=1461;
if(days>365){jy+=parseInt((days-1)/365);days=(days-1)%365}
var jm=(days<186)?1+parseInt(days/31):7+parseInt((days-186)/30);
var jd=1+((days<186)?(days%31):((days-186)%30));
return [jy,jm,jd];
}
function j2g(jy,jm,jd){
jy+=1595;
var days=365*jy+parseInt((jy+3)/33)*8+parseInt(((jy%33)+3)/4)+78+jd+(jm<7?(jm-1)*31:186+(jm-7)*30);
days-=1;
var gy=400*parseInt(days/146097);
days%=146097;
if(days>36524){gy+=parseInt(days/36524)*100;days%=36524;if(days>=365)days++}
gy+=parseInt(days/1461)*4;
days%=1461;
if(days>365){days-=365;gy++}
var gd=days+1;
var sal_a=[0,31,((gy%4===0&&gy%100!==0)||gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31];
var gm2=0;
for(var i=1;i<=12;i++){if(gd<=sal_a[i-1]){gm2=i;break}gd-=sal_a[i-1]}
return [gy,gm2,gd];
}
function monthDays(jy,jm){
if(jm<=6)return 31;
if(jm<=11)return 30;
var r=jy%33;
return (r===1||r===5||r===9||r===13||r===17||r===22||r===26||r===30)?30:29;
}
function dayOfWeek(jy,jm,jd){
var g=j2g(jy,jm,jd);
var d=new Date(g[0],g[1]-1,g[2]);
return (d.getDay()+1)%7;
}
var HOLIDAYS={
'1-1':'نوروز','1-2':'عید نوروز','1-3':'عید نوروز','1-4':'عید نوروز','1-12':'روز جمهوری اسلامی','1-13':'سیزده‌بدر',
'3-14':'رحلت امام خمینی','5-14':'روز آزادسازی خرمشهر','10-22':'پیروزی انقلاب','12-29':'روز ملی شدن صنعت نفت'
};
var curY,curM;
function init(){
var now=new Date();
var j=g2j(now.getFullYear(),now.getMonth()+1,now.getDate());
curY=j[0];curM=j[1];
render();
}
function render(){
document.getElementById('mName').textContent=J_MONTHS[curM-1];
document.getElementById('yName').textContent=curY;
var now=new Date();
var tj=g2j(now.getFullYear(),now.getMonth()+1,now.getDate());
var tDow=dayOfWeek(tj[0],tj[1],tj[2]);
document.getElementById('todayInfo').textContent='امروز: '+WEEK_DAYS[tDow]+'، '+tj[2]+' '+J_MONTHS[tj[1]-1]+' '+tj[0];
var firstDow=dayOfWeek(curY,curM,1);
var days=monthDays(curY,curM);
var grid=document.getElementById('grid');
grid.innerHTML='';
for(var i=0;i<firstDow;i++){var d=document.createElement('div');d.className='day other';grid.appendChild(d)}
for(var day=1;day<=days;day++){
var el=document.createElement('div');
el.className='day';
el.textContent=fa(day);
var dow=dayOfWeek(curY,curM,day);
if(dow===6)el.classList.add('fri');
if(HOLIDAYS[curM+'-'+day])el.classList.add('holiday');
if(curY===tj[0]&&curM===tj[1]&&day===tj[2])el.classList.add('today');
(function(dd){el.onclick=function(){selectDay(dd)}})(day);
grid.appendChild(el);
}
renderEvents();
}
function renderEvents(){
var e=document.getElementById('events');e.innerHTML='';
var found=false;
for(var k in HOLIDAYS){
var p=k.split('-');
if(parseInt(p[0])===curM){
found=true;
var d=document.createElement('div');d.className='ev';
d.innerHTML='<span class="dot"></span><span>'+HOLIDAYS[k]+'</span><span class="d">'+p[1]+' '+J_MONTHS[curM-1]+'</span>';
e.appendChild(d);
}
}
if(!found)e.innerHTML='<div style="color:#64748b;font-size:12px;text-align:center;padding:8px">مناسبت خاصی ثبت نشده</div>';
}
function changeMonth(d){curM+=d;if(curM>12){curM=1;curY++}if(curM<1){curM=12;curY--}render()}
function goToday(){var now=new Date();var j=g2j(now.getFullYear(),now.getMonth()+1,now.getDate());curY=j[0];curM=j[1];render()}
function selectDay(d){
var dow=dayOfWeek(curY,curM,d);
var g=j2g(curY,curM,d);
var txt=WEEK_DAYS[dow]+'، '+d+' '+J_MONTHS[curM-1]+' '+curY+'\nمیلادی: '+g[2]+'/'+g[1]+'/'+g[0];
var h=HOLIDAYS[curM+'-'+d];
if(h)txt+='\n\n📌 '+h;
alert(txt);
}
function fa(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})}
init();
</script>
</body>
  </html>
