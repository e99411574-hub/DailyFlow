<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>برنامه من</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg1:#f8f9fc;--bg2:#eef1f8;--card:#fff;--text:#1a1f36;--t2:#6b7280;--t3:#9ca3af;--pr:#6366f1;--pr2:#8b5cf6;--bd:rgba(0,0,0,.06);--rad:18px;--sd:0 4px 20px rgba(99,102,241,.08)}
body[data-t=dark]{--bg1:#0a0e1a;--bg2:#0f1424;--card:#1a1f32;--text:#f1f5f9;--t2:#94a3b8;--t3:#64748b;--pr:#818cf8;--pr2:#a78bfa;--bd:rgba(255,255,255,.06);--sd:0 4px 20px rgba(0,0,0,.4)}
body[data-t=mint]{--bg1:#f0fdf4;--bg2:#dcfce7;--card:#fff;--text:#064e3b;--t2:#059669;--t3:#34d399;--pr:#10b981;--pr2:#14b8a6;--bd:rgba(16,185,129,.1)}
body[data-t=ocean]{--bg1:#eff6ff;--bg2:#dbeafe;--card:#fff;--text:#1e3a8a;--t2:#3b82f6;--t3:#60a5fa;--pr:#3b82f6;--pr2:#2563eb;--bd:rgba(59,130,246,.1)}
body[data-t=purple]{--bg1:#faf5ff;--bg2:#f3e8ff;--card:#fff;--text:#581c87;--t2:#9333ea;--t3:#a855f7;--pr:#a855f7;--pr2:#d946ef;--bd:rgba(168,85,247,.1)}
body[data-t=rose]{--bg1:#fff1f2;--bg2:#ffe4e6;--card:#fff;--text:#881337;--t2:#e11d48;--t3:#fb7185;--pr:#e11d48;--pr2:#ec4899;--bd:rgba(225,29,72,.1)}
body[data-t=midnight]{--bg1:#0f172a;--bg2:#1e293b;--card:#1e293b;--text:#f1f5f9;--t2:#94a3b8;--t3:#64748b;--pr:#38bdf8;--pr2:#a78bfa;--bd:rgba(255,255,255,.06);--sd:0 4px 20px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--text);min-height:100vh;transition:background .3s,color .3s}
.view{display:none}.view.active{display:block}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);box-shadow:var(--sd);position:sticky;top:0;z-index:10}
.hdr h1{font-size:17px;font-weight:700;background:linear-gradient(135deg,var(--pr),var(--pr2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ibtn{background:none;border:none;font-size:20px;cursor:pointer;width:42px;height:42px;border-radius:12px;color:var(--text);display:flex;align-items:center;justify-content:center}
.ibtn:active{background:var(--bd)}
.wrap{padding:18px 16px 90px;max-width:600px;margin:0 auto}
.pbox{background:var(--card);border-radius:var(--rad);padding:16px 20px;box-shadow:var(--sd);margin-bottom:20px;position:relative;overflow:hidden;border:1px solid var(--bd)}
.pbox::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pr),var(--pr2),var(--pr));background-size:200% 100%}
.ptxt{font-size:13px;color:var(--t2);margin-bottom:10px;display:flex;justify-content:space-between;font-weight:600}
.ptxt span:last-child{color:var(--pr)}
.bar{height:10px;background:var(--bd);border-radius:10px;overflow:hidden}
.bfill{height:100%;width:0;background:linear-gradient(90deg,var(--pr),var(--pr2));transition:width .5s ease;border-radius:10px}
.stitle{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 12px;gap:10px}
.stitle>span{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--text)}
.ico{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--pr),var(--pr2));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 12px rgba(99,102,241,.3)}
.stitle button{background:none;border:none;color:var(--t3);font-size:14px;cursor:pointer;padding:6px 10px;border-radius:10px}
.stitle button:active{background:var(--bd)}
ul{list-style:none}
li{background:var(--card);margin:8px 0;padding:14px 16px;border-radius:14px;box-shadow:var(--sd);display:flex;align-items:center;gap:10px;border:1px solid var(--bd);transition:transform .2s}
li:active{transform:scale(.98)}
li.done{opacity:.5}
li.done .txt{text-decoration:line-through;color:var(--t2)}
li label{display:flex;align-items:center;gap:12px;cursor:pointer;flex:1;min-width:0}
li input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--bd);background:var(--card);cursor:pointer;flex-shrink:0;position:relative}
li input[type=checkbox]:checked{background:linear-gradient(135deg,var(--pr),var(--pr2));border-color:transparent;box-shadow:0 2px 8px rgba(99,102,241,.4)}
li input[type=checkbox]:checked::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
.txt{font-size:15px;font-weight:500;flex:1;word-break:break-word;display:flex;flex-direction:column;gap:4px}
.tm{font-size:11px;color:var(--pr);background:var(--bd);padding:3px 10px;border-radius:8px;align-self:flex-start;font-weight:600}
.edt{background:none;border:none;cursor:pointer;font-size:15px;padding:6px;border-radius:10px;color:var(--t3);opacity:.7}
.edt:active{background:var(--bd);opacity:1}
.rbtn{display:block;width:100%;margin-top:24px;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px rgba(239,68,68,.25)}
.rbtn:active{transform:scale(.97)}
.addbtn{display:flex;align-items:center;justify-content:center;width:100%;margin-top:10px;padding:12px;border:2px dashed var(--bd);border-radius:14px;background:transparent;color:var(--t2);font-family:inherit;font-size:13px;cursor:pointer}
.addbtn:active{background:var(--bd)}
.slist{background:var(--card);border-radius:var(--rad);overflow:hidden;box-shadow:var(--sd);border:1px solid var(--bd);margin-top:16px}
.srow{padding:18px 20px;border-bottom:1px solid var(--bd)}
.srow:last-child{border-bottom:none}
.slbl{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:8px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tbtn-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.tbtn{width:100%;aspect-ratio:1;border-radius:16px;border:3px solid transparent;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:all .2s}
.tbtn.active{border-color:var(--pr);transform:scale(1.05)}
.tname{font-size:11px;color:var(--t2);font-weight:500}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.mdl{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mdl h3{margin:0 0 16px;font-size:16px;color:var(--text);font-weight:700}
.mdl input{width:100%;padding:13px 15px;font-size:15px;font-family:inherit;border:2px solid var(--bd);border-radius:12px;background:var(--bg1);color:var(--text);margin-bottom:10px;outline:none}
.mdl input:focus{border-color:var(--pr)}
.mac{display:flex;gap:8px;margin-top:6px}
.mac button{flex:1;padding:12px;border:none;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.mac button:active{transform:scale(.96)}
.bc{background:var(--bd);color:var(--text)}
.bs{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}
.bd2{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:11px 24px;border-radius:14px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:all .3s;pointer-events:none;max-width:90%;box-shadow:0 12px 30px rgba(99,102,241,.4)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fab{position:fixed;bottom:24px;left:24px;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 12px 30px rgba(99,102,241,.45);z-index:50;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.9) rotate(90deg)}
</style>
</head>
<body>

<div id="vm" class="view active">
<div class="hdr">
<button class="ibtn" onclick="openSet()">⚙️</button>
<h1>برنامه روزانه</h1>
<button class="ibtn" onclick="scrollBottom()">＋</button>
</div>
<div class="wrap">
<div class="pbox">
<div class="ptxt"><span>پیشرفت امروز</span><span id="cnt">۰ از ۰</span></div>
<div class="bar"><div class="bfill" id="fl"></div></div>
</div>
<div id="app"></div>
<button class="rbtn" onclick="resetAll()">🔄 شروع روز جدید</button>
</div>
<button class="fab" onclick="addSection()">＋</button>
</div>

<div id="vs" class="view">
<div class="hdr">
<button class="ibtn" onclick="closeSet()">←</button>
<h1>تنظیمات</h1>
<div style="width:42px"></div>
</div>
<div class="wrap">
<div class="slist">
<div class="srow">
<div class="slbl">🎨 رنگ‌بندی</div>
<div class="tgrid" id="tgrid"></div>
</div>
</div>
<div class="slist">
<div class="srow" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
<div class="slbl" style="margin:0">🗑 پاک کردن داده‌ها</div>
<button class="edt" onclick="clearAll()" style="color:#ef4444;opacity:1;font-size:13px;font-weight:600">پاک کردن</button>
</div>
</div>
<p style="text-align:center;color:var(--t3);font-size:12px;margin-top:30px">نسخهٔ ۵.۰</p>
</div>
</div>

<div id="em" class="ovl" style="display:none">
<div class="mdl">
<h3 id="emTitle">✏️ ویرایش</h3>
<input type="text" id="ei" placeholder="متن...">
<input type="text" id="et" placeholder="ساعت (اختیاری)">
<div class="mac">
<button class="bd2" id="delBtn" onclick="delItem()">حذف</button>
<button class="bc" onclick="closeEdt()">لغو</button>
<button class="bs" onclick="saveEdt()">ذخیره</button>
</div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
var KP='plan_v10',KT='theme_v10',KD='date_v10';
var THEMES=[
{id:'light',nm:'روشن',c1:'#ffffff',c2:'#6366f1'},
{id:'dark',nm:'تاریک',c1:'#1a1f32',c2:'#818cf8'},
{id:'mint',nm:'نعنایی',c1:'#f0fdf4',c2:'#10b981'},
{id:'ocean',nm:'اقیانوس',c1:'#eff6ff',c2:'#3b82f6'},
{id:'purple',nm:'بنفش',c1:'#faf5ff',c2:'#a855f7'},
{id:'rose',nm:'رز',c1:'#fff1f2',c2:'#e11d48'},
{id:'midnight',nm:'نیمه‌شب',c1:'#0f172a',c2:'#38bdf8'}
];
var DEF=[
{title:"🌅 صبح",items:["بیدار شدن","۱ لیوان آب","مسواک صبح","شستن صورت","صبحانه"]},
{title:"🏫 مدرسه",items:["مدرسه / کلاس‌ها","ناهار","مسواک ظهر","خواب ظهر ۳۰ دقیقه"]},
{title:"📚 مطالعه",items:["ریاضی","هندسه","فیزیک","شیمی"]},
{title:"🌤️ عصر و ورزش",items:["میان‌وعده عصر","ورزش ۳۰–۶۰ دقیقه","حمام / بهداشت","سیبیل / موهای زائد"]},
{title:"🌙 شب",items:["شام","مرور درس‌ها","حل تمرین و تست","هوای آزاد","تکمیل ۶–۸ لیوان آب","کنار گذاشتن گوشی","مسواک شب","شستن صورت شب","خواب شب"]}
];
var TODAY=new Date().toLocaleDateString('fa-IR');
var plan=[];
try{var s=localStorage.getItem(KP);if(s)plan=JSON.parse(s)}catch(e){plan=[]}
if(!plan||!Array.isArray(plan)||plan.length===0||!plan[0].tasks){
plan=[];
for(var i=0;i<DEF.length;i++){
var sec=DEF[i];
var tasks=[];
for(var j=0;j<sec.items.length;j++){
tasks.push({id:'t'+i+'_'+j,text:sec.items[j],time:'',done:false});
}
plan.push({id:'s'+i,title:sec.title,tasks:tasks});
}
try{localStorage.setItem(KP,JSON.stringify(plan))}catch(e){}
}
if(localStorage.getItem(KD)!==TODAY){
for(var a=0;a<plan.length;a++){
for(var b=0;b<plan[a].tasks.length;b++){
plan[a].tasks[b].done=false;
}
}
try{localStorage.setItem(KP,JSON.stringify(plan));localStorage.setItem(KD,TODAY)}catch(e){}
}
var editKey=null,addMode=null;
function save(){try{localStorage.setItem(KP,JSON.stringify(plan))}catch(e){}}
function toFa(n){return n.toLocaleString('fa-IR')}
function applyTheme(){
var t=localStorage.getItem(KT)||'light';
document.body.setAttribute('data-t',t);
renderThemes();
}
function setTheme(t){try{localStorage.setItem(KT,t)}catch(e){};applyTheme();showToast('🎨 تم تغییر کرد')}
function renderThemes(){
var g=document.getElementById('tgrid');g.innerHTML='';
var cur=localStorage.getItem(KT)||'light';
for(var i=0;i<THEMES.length;i++){
var th=THEMES[i];
var wrap=document.createElement('div');wrap.className='tbtn-wrap';
var btn=document.createElement('button');
btn.className='tbtn'+(th.id===cur?' active':'');
btn.style.background='linear-gradient(135deg,'+th.c1+' 50%,'+th.c2+' 50%)';
(function(id){btn.onclick=function(){setTheme(id)}})(th.id);
var nm=document.createElement('div');nm.className='tname';nm.textContent=th.nm;
wrap.appendChild(btn);wrap.appendChild(nm);g.appendChild(wrap);
}
}
function icon(title){
var m=title.match(/^(\S+)/);
return m?m[1]:'📌';
}
function titleText(title){
return title.replace(/^\S+\s*/,'')||title;
}
function render(){
var app=document.getElementById('app');app.innerHTML='';
for(var si=0;si<plan.length;si++){
var sec=plan[si];
var h=document.createElement('div');h.className='stitle';
var left=document.createElement('span');
var ic=document.createElement('span');ic.className='ico';ic.textContent=icon(sec.title);
var tx=document.createElement('span');tx.textContent=titleText(sec.title);
left.appendChild(ic);left.appendChild(tx);
var hb=document.createElement('button');hb.textContent='✏️';
(function(i){hb.onclick=function(){editSection(i)}})(si);
h.appendChild(left);h.appendChild(hb);app.appendChild(h);
var ul=document.createElement('ul');
for(var ti=0;ti<sec.tasks.length;ti++){
var t=sec.tasks[ti];
var li=document.createElement('li');
if(t.done)li.className='done';
var lb=document.createElement('label');
var cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;
(function(task,l,cb2){
cb2.onchange=function(){
task.done=cb2.checked;save();
if(cb2.checked)l.classList.add('done');else l.classList.remove('done');
updateProg();
if(cb2.checked)showToast('✨ آفرین!');
};
})(t,li,cb);
var sp=document.createElement('span');sp.className='txt';
var tx2=document.createElement('span');tx2.textContent=t.text;sp.appendChild(tx2);
if(t.time){var tm=document.createElement('span');tm.className='tm';tm.textContent='🕐 '+t.time;sp.appendChild(tm)}
lb.appendChild(cb);lb.appendChild(sp);
var eb=document.createElement('button');eb.className='edt';eb.textContent='✏️';
(function(s2,t2){eb.onclick=function(e){e.preventDefault();openEdt(s2,t2)}})(si,ti);
li.appendChild(lb);li.appendChild(eb);ul.appendChild(li);
}
app.appendChild(ul);
var ab=document.createElement('button');ab.className='addbtn';ab.textContent='+ افزودن کار';
(function(i){ab.onclick=function(){addTask(i)}})(si);
app.appendChild(ab);
}
updateProg();
}
function updateProg(){
var tot=0,dn=0;
for(var i=0;i<plan.length;i++){
for(var j=0;j<plan[i].tasks.length;j++){
tot++;
if(plan[i].tasks[j].done)dn++;
}
}
document.getElementById('cnt').textContent=toFa(dn)+' از '+toFa(tot);
document.getElementById('fl').style.width=(tot?dn/tot*100:0)+'%';
if(tot>0&&dn===tot)setTimeout(function(){showToast('🎉 همه کارها انجام شد!')},300);
}
function showToast(msg){
var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
if(window._tt)clearTimeout(window._tt);
window._tt=setTimeout(function(){t.classList.remove('on')},2000);
}
function resetAll(){
if(confirm('همه تیک‌ها پاک شود؟')){
for(var i=0;i<plan.length;i++){
for(var j=0;j<plan[i].tasks.length;j++){
plan[i].tasks[j].done=false;
}
}
save();render();showToast('🔄 روز جدید شروع شد');
}
}
function clearAll(){
if(confirm('همه داده‌ها پاک شود؟')){
try{localStorage.removeItem(KP);localStorage.removeItem(KD)}catch(e){}
location.reload();
}
}
function scrollBottom(){window.scrollTo(0,document.body.scrollHeight)}
function openEdt(si,ti){
editKey={si:si,ti:ti};addMode=null;
document.getElementById('emTitle').textContent='✏️ ویرایش کار';
document.getElementById('ei').value=plan[si].tasks[ti].text;
document.getElementById('et').value=plan[si].tasks[ti].time||'';
document.getElementById('et').style.display='block';
document.getElementById('delBtn').style.display='block';
document.getElementById('em').style.display='flex';
}
function editSection(si){
addMode=null;editKey={si:si,section:true};
document.getElementById('emTitle').textContent='✏️ ویرایش عنوان';
document.getElementById('ei').value=plan[si].title;
document.getElementById('et').value='';
document.getElementById('et').style.display='none';
document.getElementById('delBtn').style.display='block';
document.getElementById('em').style.display='flex';
}
function addTask(si){
addMode={si:si,task:true};editKey=null;
document.getElementById('emTitle').textContent='➕ افزودن کار';
document.getElementById('ei').value='';
document.getElementById('et').value='';
document.getElementById('et').style.display='block';
document.getElementById('delBtn').style.display='none';
document.getElementById('em').style.display='flex';
}
function addSection(){
addMode={section:true};editKey=null;
document.getElementById('emTitle').textContent='➕ بخش جدید';
document.getElementById('ei').value='';
document.getElementById('et').value='';
document.getElementById('et').style.display='none';
document.getElementById('delBtn').style.display='none';
document.getElementById('em').style.display='flex';
}
function closeEdt(){
document.getElementById('em').style.display='none';
document.getElementById('et').style.display='block';
editKey=null;addMode=null;
}
function saveEdt(){
var v=document.getElementById('ei').value.trim();
if(!v)return;
var t=document.getElementById('et').value.trim();
if(addMode){
if(addMode.task){plan[addMode.si].tasks.push({id:'t'+Date.now(),text:v,time:t,done:false});showToast('✅ اضافه شد')}
else if(addMode.section){plan.push({id:'s'+Date.now(),title:v,tasks:[]});showToast('✅ بخش اضافه شد')}
}
else if(editKey){
if(editKey.section){plan[editKey.si].title=v}
else{plan[editKey.si].tasks[editKey.ti].text=v;plan[editKey.si].tasks[editKey.ti].time=t}
showToast('💾 ذخیره شد');
}
save();closeEdt();render();
}
function delItem(){
if(!editKey)return;
if(editKey.section){
if(!confirm('این بخش حذف شود؟'))return;
plan.splice(editKey.si,1);
}
else{
if(!confirm('این کار حذف شود؟'))return;
plan[editKey.si].tasks.splice(editKey.ti,1);
}
save();closeEdt();render();showToast('🗑 حذف شد');
}
function openSet(){document.getElementById('vm').classList.remove('active');document.getElementById('vs').classList.add('active')}
function closeSet(){document.getElementById('vs').classList.remove('active');document.getElementById('vm').classList.add('active')}

applyTheme();render();
document.getElementById('em').onclick=function(e){if(e.target.id==='em')closeEdt()};
</script>
</body>
  </html>
