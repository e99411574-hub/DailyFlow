<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>برنامه من</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#2c3e50;--tl:#7f8c8d;--pr:#27ae60;--ac:#2980b9;--bar:#ecf0f1;--dgr:#e74c3c;--bd:#e0e6ed}
body.dark{--bg:#12161c;--card:#1e242e;--text:#ecf0f1;--tl:#95a5a6;--pr:#2ecc71;--ac:#3498db;--bar:#2c3442;--bd:#2c3442}
*{box-sizing:border-box}
body{font-family:Tahoma,sans-serif;background:var(--bg);color:var(--text);margin:0;min-height:100vh}
.view{display:none}.view.active{display:block}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.08);position:sticky;top:0;z-index:10}
.hdr h1{font-size:16px;margin:0}
.ibtn{background:none;border:none;font-size:22px;cursor:pointer;padding:6px;border-radius:50%;color:var(--text);width:42px;height:42px}
.ibtn:active{background:var(--bar)}
.wrap{padding:16px;max-width:560px;margin:0 auto}
.pbox{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:16px}
.ptxt{font-size:13px;color:var(--tl);margin-bottom:8px;display:flex;justify-content:space-between}
.bar{height:10px;background:var(--bar);border-radius:10px;overflow:hidden}
.bfill{height:100%;width:0;background:var(--pr);transition:width .3s}
.stitle{font-size:14px;font-weight:bold;color:var(--ac);margin:18px 6px 8px}
ul{list-style:none;padding:0;margin:0}
li{background:var(--card);margin:7px 0;padding:12px 14px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;align-items:center;gap:8px}
li.done{opacity:.5}
li.done .txt{text-decoration:line-through;color:var(--tl)}
li label{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0}
li input[type=checkbox]{width:22px;height:22px;accent-color:var(--pr);flex-shrink:0}
.txt{font-size:15px;flex:1;word-break:break-word}
.edt{background:none;border:none;cursor:pointer;font-size:15px;padding:6px;border-radius:8px;color:var(--tl)}
.rbtn{display:block;width:100%;margin-top:20px;padding:12px;border:none;border-radius:12px;background:var(--dgr);color:#fff;font-family:inherit;font-size:14px;cursor:pointer}
.slist{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.srow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd)}
.srow:last-child{border-bottom:none}
.slbl{font-size:15px}
.tg{position:relative;width:46px;height:26px;background:var(--bar);border-radius:13px;cursor:pointer;transition:background .3s}
.tg.on{background:var(--pr)}
.tg::after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .3s}
.tg.on::after{transform:translateX(-20px)}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.mdl{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:400px}
.mdl h3{margin:0 0 14px;font-size:16px}
.mdl input{width:100%;padding:12px;font-size:15px;font-family:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--text);margin-bottom:14px;outline:none}
.mac{display:flex;gap:8px}
.mac button{flex:1;padding:11px;border:none;border-radius:10px;font-family:inherit;font-size:14px;cursor:pointer}
.bc{background:var(--bar);color:var(--text)}
.bs{background:var(--pr);color:#fff}
.bd{background:var(--dgr);color:#fff}
</style>
</head>
<body>

<div id="vm" class="view active">
<div class="hdr">
<button class="ibtn" onclick="openSet()">⚙️</button>
<h1>🌿 برنامه روزانه</h1>
<button class="ibtn" onclick="location.href='game.html'">🐐</button>
</div>
<div class="wrap">
<div class="pbox">
<div class="ptxt"><span>پیشرفت امروز</span><span id="cnt">۰ از ۰</span></div>
<div class="bar"><div class="bfill" id="fl"></div></div>
</div>
<div id="app"></div>
<button class="rbtn" onclick="resetAll()">شروع روز جدید</button>
</div>
</div>

<div id="vs" class="view">
<div class="hdr">
<button class="ibtn" onclick="closeSet()">←</button>
<h1>⚙️ تنظیمات</h1>
<div style="width:42px"></div>
</div>
<div class="wrap">
<div class="slist">
<div class="srow">
<span class="slbl">🌙 حالت تاریک</span>
<div class="tg" id="dtg" onclick="togDark()"></div>
</div>
</div>
</div>
</div>

<div id="em" class="ovl" style="display:none">
<div class="mdl">
<h3>✏️ ویرایش کار</h3>
<input type="text" id="ei" placeholder="متن کار...">
<div class="mac">
<button class="bd" onclick="delTask()">حذف</button>
<button class="bc" onclick="closeEdt()">لغو</button>
<button class="bs" onclick="saveEdt()">ذخیره</button>
</div>
</div>
</div>

<script>
var DEFAULT_PLAN=[
{title:"🌅 صبح",items:["بیدار شدن","۱ لیوان آب","مسواک صبح","شستن صورت","صبحانه"]},
{title:"🏫 مدرسه",items:["مدرسه / کلاس‌ها","ناهار","مسواک ظهر","خواب ظهر ۳۰ دقیقه"]},
{title:"📚 مطالعه",items:["ریاضی","هندسه","فیزیک","شیمی"]},
{title:"🌤️ عصر و ورزش",items:["میان‌وعده عصر","ورزش ۳۰–۶۰ دقیقه","حمام / بهداشت","سیبیل / موهای زائد"]},
{title:"🌙 شب",items:["شام","مرور درس‌ها","حل تمرین و تست","هوای آزاد","تکمیل ۶–۸ لیوان آب","کنار گذاشتن گوشی","مسواک شب","شستن صورت شب","خواب شب"]}
];

var TODAY=new Date().toLocaleDateString('fa-IR');
var KP='plan_v5',KD='date_v5',KT='theme_v5';
var plan=null;

try{plan=JSON.parse(localStorage.getItem(KP)||'null');}catch(e){plan=null;}

if(!plan||!plan.length||!plan[0]||!plan[0].items){
plan=DEFAULT_PLAN.map(function(s){
return {title:s.title,items:s.items.map(function(t){return {text:t,done:false};})};
});
localStorage.setItem(KP,JSON.stringify(plan));
}

if(localStorage.getItem(KD)!==TODAY){
plan.forEach(function(s){s.items.forEach(function(i){i.done=false;});});
localStorage.setItem(KP,JSON.stringify(plan));
localStorage.setItem(KD,TODAY);
}

var editKey=null;

function savePlan(){localStorage.setItem(KP,JSON.stringify(plan));}
function toFa(n){return n.toLocaleString('fa-IR');}

function applyTheme(){
var t=localStorage.getItem(KT)||'light';
if(t==='dark')document.body.classList.add('dark');else document.body.classList.remove('dark');
var tg=document.getElementById('dtg');
if(tg){if(t==='dark')tg.classList.add('on');else tg.classList.remove('on');}
}
function togDark(){
var c=localStorage.getItem(KT)||'light';
localStorage.setItem(KT,c==='dark'?'light':'dark');
applyTheme();
}

function render(){
var app=document.getElementById('app');
app.innerHTML='';
plan.forEach(function(sec,si){
var h=document.createElement('div');
h.className='stitle';
h.textContent=sec.title;
app.appendChild(h);
var ul=document.createElement('ul');
sec.items.forEach(function(item,ii){
var li=document.createElement('li');
if(item.done)li.className='done';
var lb=document.createElement('label');
var cb=document.createElement('input');
cb.type='checkbox';
cb.checked=item.done;
cb.onchange=function(){
item.done=cb.checked;
savePlan();
if(cb.checked)li.classList.add('done');else li.classList.remove('done');
updateProg();
};
var sp=document.createElement('span');
sp.className='txt';
sp.textContent=item.text;
lb.appendChild(cb);lb.appendChild(sp);
var eb=document.createElement('button');
eb.className='edt';
eb.textContent='✏️';
eb.onclick=function(e){e.preventDefault();openEdt(si,ii);};
li.appendChild(lb);li.appendChild(eb);
ul.appendChild(li);
});
app.appendChild(ul);
});
updateProg();
}
function updateProg(){
var total=0,done=0;
plan.forEach(function(s){s.items.forEach(function(i){total++;if(i.done)done++;});});
document.getElementById('cnt').textContent=toFa(done)+' از '+toFa(total);
document.getElementById('fl').style.width=(total?done/total*100:0)+'%';
}
function resetAll(){
if(confirm('همه تیک‌ها پاک شود؟')){
plan.forEach(function(s){s.items.forEach(function(i){i.done=false;});});
savePlan();render();
}
}

function openEdt(si,ii){
editKey={si:si,ii:ii};
document.getElementById('ei').value=plan[si].items[ii].text;
document.getElementById('em').style.display='flex';
setTimeout(function(){document.getElementById('ei').focus();},100);
}
function closeEdt(){document.getElementById('em').style.display='none';editKey=null;}
function saveEdt(){
if(!editKey)return;
var v=document.getElementById('ei').value.trim();
if(!v)return;
plan[editKey.si].items[editKey.ii].text=v;
savePlan();closeEdt();render();
}
function delTask(){
if(!editKey)return;
if(!confirm('این کار حذف شود؟'))return;
plan[editKey.si].items.splice(editKey.ii,1);
savePlan();closeEdt();render();
}

function openSet(){
document.getElementById('vm').classList.remove('active');
document.getElementById('vs').classList.add('active');
}
function closeSet(){
document.getElementById('vs').classList.remove('active');
document.getElementById('vm').classList.add('active');
}

applyTheme();
render();

document.getElementById('em').addEventListener('click',function(e){
if(e.target.id==='em')closeEdt();
});
</script>
</body>
</html>
