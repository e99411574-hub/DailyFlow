<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6C5CE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ستاره">
<meta name="description" content="ستاره - بازی کن، بساز، بدرخش">
<title>⭐ ستاره | Setareh</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">

<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body data-theme="theme_purple">

<div class="app">

  <header class="hdr">
    <div class="hdr-logo">
      <span>⭐</span>
      <span>ستاره</span>
    </div>
    <div class="hdr-coins" onclick="ROUTER.go('shop')">
      <span class="icon">🪙</span>
      <span id="hdrCoins">۰</span>
    </div>
  </header>

  <section id="view-home" class="view active">
    <div id="greeting" class="sec-title"></div>
    <div id="homeContent"></div>
  </section>

  <section id="view-games" class="view">
    <div id="gamesContent"></div>
  </section>

  <section id="view-tools" class="view">
    <div id="toolsContent"></div>
  </section>

  <section id="view-shop" class="view">
    <div id="shopContent"></div>
  </section>

  <section id="view-profile" class="view">
    <div id="profileContent"></div>
  </section>

  <section id="view-settings" class="view">
    <div id="settingsContent"></div>
  </section>

</div>

<nav class="nav">
  <button class="nav-btn active" data-view="home">
    <span class="nav-icon">🏠</span>
    <span>خانه</span>
  </button>
  <button class="nav-btn" data-view="games">
    <span class="nav-icon">🎮</span>
    <span>بازی</span>
  </button>
  <button class="nav-btn" data-view="tools">
    <span class="nav-icon">🧰</span>
    <span>ابزار</span>
  </button>
  <button class="nav-btn" data-view="shop">
    <span class="nav-icon">🛒</span>
    <span>فروشگاه</span>
  </button>
  <button class="nav-btn" data-view="profile">
    <span class="nav-icon">👤</span>
    <span>من</span>
  </button>
</nav>

<div id="toast" class="toast"></div>

<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/tick.js"></script>

<script src="js/storage.js"></script>
<script src="js/state.js"></script>
<script src="js/router.js"></script>

<script src="js/shop.js"></script>
<script src="js/profile.js"></script>

<script src="js/app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js').catch(function(e) {
        console.log('SW register failed:', e);
      });
    });
  }

  if (typeof window.showToast !== 'function') {
    window.showToast = function(msg) {
      var el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('on');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(function() {
        el.classList.remove('on');
      }, 2200);
    };
  }
</script>

</body>
</html>
