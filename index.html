<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>برنامه من</title>
<style>
body{font-family:Tahoma;background:#f4f6f8;padding:15px;margin:0}
h1{text-align:center;font-size:20px}
.p{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.bar{height:10px;background:#eee;border-radius:10px;overflow:hidden}
.fill{height:100%;width:0;background:#27ae60;transition:.3s}
.txt{font-size:13px;color:#555;margin-bottom:6px;text-align:center}
ul{list-style:none;padding:0}
li{background:#fff;margin:6px 0;padding:12px;border-radius:10px;box-shadow:0 1px 4px #0001}
li.d{opacity:.5}
li.d span{text-decoration:line-through}
label{display:flex;align-items:center;gap:10px;cursor:pointer}
input{width:20px;height:20px;accent-color:#27ae60}
.sec{font-weight:bold;color:#2980b9;margin:14px 6px 6px;font-size:14px}
button{width:100%;padding:12px;border:none;border-radius:10px;background:#e74c3c;color:#fff;font-size:14px;font-family:inherit;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>🌿 برنامه روزانه</h1>
<div class="p">
  <div class="txt" id="t">۰ از ۰</div>
  <div class="bar"><div class="fill" id="f"></div></div>
</div>
<div id="app"></div>
<button onclick="if(confirm('همه پاک شود؟')){localStorage.removeItem(k);location.reload()}">شروع روز جدید</button>
<script>
var plan=[
["🌅 صبح",["بیدار شدن","۱ لیوان آب","مسواک صبح","شستن صورت","صبحانه"]],
["🏫 مدرسه",["مدرسه / کلاس‌ها","ناهار","مسواک ظهر","خواب ظهر: ۳۰ دقیقه"]],
["📚 مطالعه",["ریاضی","هندسه","فیزیک","شیمی"]],
["🌤️ عصر و ورزش",["میان‌وعده عصر","ورزش: ۳۰–۶۰ دقیقه","حمام / بهداشت","سیبیل / موهای زائد"]],
["🌙 شب",["شام","مرور درس‌های روز","حل تمرین و تست","هوای آزاد","تکمیل ۶–۸ لیوان آب","کنار گذاشتن گوشی","مسواک شب","شستن صورت شب","خواب شب"]]
];
var k='p_'+new Date().toLocaleDateString('fa-IR');
var s=JSON.parse(localStorage.getItem(k)||'{}');
var app=document.getElementById('app'),total=0,keys=[];
plan.forEach(function(sec,si){
  var h=document.createElement('div');h.className='sec';h.textContent=sec[0];app.appendChild(h);
  var ul=document.createElement('ul');
  sec[1].forEach(function(it,ii){
    var key=si+'-'+ii;keys.push(key);total++;
    var li=document.createElement('li');
    var lb=document.createElement('label');
    var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!s[key];
    if(cb.checked)li.classList.add('d');
    var sp=document.createElement('span');sp.textContent=it;
    cb.onchange=function(){s[key]=cb.checked;localStorage.setItem(k,JSON.stringify(s));li.classList.toggle('d',cb.checked);up()};
    lb.appendChild(cb);lb.appendChild(sp);li.appendChild(lb);ul.appendChild(li);
  });
  app.appendChild(ul);
});
function up(){
  var d=keys.filter(function(x){return s[x]}).length;
  document.getElementById('t').textContent=d.toLocaleString('fa-IR')+' از '+total.toLocaleString('fa-IR');
  document.getElementById('f').style.width=(total?d/total*100:0)+'%';
}
up();
</script>
</body>
</html>
