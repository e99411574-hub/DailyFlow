<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🐐 بز که می‌پره</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;font-family:Tahoma,sans-serif;background:#87ceeb;touch-action:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;position:fixed;top:0;left:0}
#hud{position:fixed;top:0;left:0;right:0;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:700;font-size:20px;text-shadow:0 2px 6px rgba(0,0,0,.4);z-index:5;padding-top:calc(14px + env(safe-area-inset-top))}
#hud .left{display:flex;align-items:center;gap:12px}
#mute{background:rgba(0,0,0,.25);border:none;color:#fff;font-size:18px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
#mute:active{transform:scale(.9)}
#hint{position:fixed;bottom:80px;left:0;right:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 2px 6px rgba(0,0,0,.5);pointer-events:none;opacity:.95;z-index:5}
#over{position:fixed;inset:0;background:rgba(15,23,42,.9);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:20;padding:24px;text-align:center}
#over.on{display:flex}
#over h1{font-size:32px;margin-bottom:16px}
#over .big{font-size:48px;font-weight:800;color:#fbbf24;margin:12px 0}
#over p{font-size:15px;color:#cbd5e1;margin:4px 0}
#over button{margin-top:28px;padding:16px 48px;border:none;border-radius:16px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(16,185,129,.5)}
#over button:active{transform:scale(.95)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<div class="left">
<button id="mute" onclick="toggleMute()">🔊</button>
<div>🏆 <span id="sc">۰</span></div>
</div>
</div>
<div id="hint">👆 لمس کن تا بز بپره</div>
<div id="over">
<h1>🎯 بازی تمام</h1>
<div class="big"><span id="fs">۰</span></div>
<p>امتیاز این دور</p>
<p style="margin-top:16px">بهترین: <b id="fb" style="color:#fbbf24">۰</b></p>
<button onclick="start()">🔄 دوباره</button>
</div>

<script>
var c=document.getElementById('c'),x=c.getContext('2d');
var W,H,gy,goat,obs,dist,speed,run,time,tick;
var best=parseInt(localStorage.getItem('goatBest2')||'0');

// ===== صدا =====
var audioCtx=null;
var soundOn=localStorage.getItem('goatSound')!=='off';
function initAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function beep(freq,dur,type,vol){
if(!soundOn)return;
try{
initAudio();if(!audioCtx)return;
var o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.connect(g);g.connect(audioCtx.destination);
o.type=type||'sine';
var now=audioCtx.currentTime;
o.frequency.setValueAtTime(freq,now);
g.gain.setValueAtTime(vol||0.08,now);
g.gain.exponentialRampToValueAtTime(0.001,now+dur);
o.start(now);o.stop(now+dur);
}catch(e){}
}
function sndJump(){beep(600,0.12,'sine',0.1)}
function sndDouble(){beep(900,0.15,'sine',0.1)}
function sndHit(){beep(180,0.35,'sawtooth',0.15)}
function sndScore(){beep(880,0.1,'sine',0.1);setTimeout(function(){beep(1320,0.15,'sine',0.1)},80)}
function sndStart(){beep(523,0.1,'sine',0.08);setTimeout(function(){beep(784,0.15,'sine',0.08)},100)}

function toggleMute(){
soundOn=!soundOn;
localStorage.setItem('goatSound',soundOn?'on':'off');
document.getElementById('mute').textContent=soundOn?'🔊':'🔇';
if(soundOn)beep(880,0.1,'sine',0.1);
}

function init(){
W=c.width=innerWidth;H=c.height=innerHeight;gy=H*0.75;
goat={y:gy-40,vy:0,onG:true,jumps:0};
obs=[];
dist=0;speed=5;time=0;tick=0;
document.getElementById('over').classList.remove('on');
document.getElementById('hint').style.display='block';
setTimeout(function(){document.getElementById('hint').style.display='none'},3500);
document.getElementById('sc').textContent='۰';
run=true;
}

function start(){initAudio();init();loop()}

function jump(){
if(!run)return;
if(goat.onG){
goat.vy=-14;goat.onG=false;goat.jumps=1;
sndJump();
}else if(goat.jumps===1){
goat.vy=-11;goat.jumps=2;
sndDouble();
}
}

c.addEventListener('touchstart',function(e){e.preventDefault();jump()});
c.addEventListener('mousedown',function(e){e.preventDefault();jump()});

function loop(){
if(!run)return;
upd();draw();
requestAnimationFrame(loop);
}

var lastScore=0;
function upd(){
time++;
speed=5+Math.min(time/300,3);
dist+=speed*0.1;
goat.vy+=0.8;
goat.y+=goat.vy;
if(goat.y>=gy-40){goat.y=gy-40;goat.vy=0;goat.onG=true;goat.jumps=0}
// تولید موانع
tick--;
if(tick<=0){
tick=Math.max(70-time/40,40)+Math.random()*30;
spawn();
}
// حرکت موانع
obs.forEach(function(o){o.x-=speed});
obs=obs.filter(function(o){return o.x+o.w>-50});
// برخورد
var bx=70,by=goat.y,bw=44,bh=36;
for(var i=0;i<obs.length;i++){
var o=obs[i];
if(bx+bw-8>o.x&&bx+8<o.x+o.w&&by+bh-6>o.y&&by+6<o.y+o.h){
gameOver();return;
}
}
// امتیاز هر ۱۰۰ متر صدا
var cur100=Math.floor(dist/100);
if(cur100>lastScore){lastScore=cur100;sndScore()}
document.getElementById('sc').textContent=Math.floor(dist).toLocaleString('fa-IR');
}

function spawn(){
var types=['🌵','🪨','🌳','🚧'];
var t=types[Math.floor(Math.random()*types.length)];
var h=45+Math.random()*30;
var w=40+Math.random()*20;
obs.push({x:W+30,y:gy-h,w:w,h:h,t:t});
}

function gameOver(){
run=false;
sndHit();
if(dist>best){best=Math.floor(dist);localStorage.setItem('goatBest2',best)}
document.getElementById('fs').textContent=Math.floor(dist).toLocaleString('fa-IR');
document.getElementById('fb').textContent=best.toLocaleString('fa-IR');
document.getElementById('over').classList.add('on');
lastScore=0;
}

function draw(){
var g=x.createLinearGradient(0,0,0,gy);
g.addColorStop(0,'#87ceeb');
g.addColorStop(1,'#c8e6f5');
x.fillStyle=g;x.fillRect(0,0,W,gy);
// خورشید
x.fillStyle='#ffd93b';
x.shadowColor='#ffd93b';x.shadowBlur=40;
x.beginPath();x.arc(W*0.85,90,40,0,7);x.fill();
x.shadowBlur=0;
// ابر
x.fillStyle='rgba(255,255,255,.85)';
for(var k=0;k<4;k++){
var cx=((k*280+time*0.5)%(W+200))-100;
var cy=80+k*50;
x.beginPath();
x.arc(cx,cy,28,0,7);
x.arc(cx+32,cy-8,24,0,7);
x.arc(cx-30,cy-4,22,0,7);
x.arc(cx+10,cy-22,18,0,7);
x.fill();
}
// کوه
x.fillStyle='#8fa8b8';
x.beginPath();x.moveTo(0,gy);
for(var m=0;m<=W;m+=40){
x.lineTo(m,gy-60-Math.sin(m*0.008)*30);
}
x.lineTo(W,gy);x.closePath();x.fill();
// زمین
x.fillStyle='#4a9c5c';
x.fillRect(0,gy,W,H-gy);
x.fillStyle='#3d8550';
x.fillRect(0,gy,W,5);
// علف
x.strokeStyle='#3d8550';
x.lineWidth=2;
for(var i=0;i<30;i++){
var gx=(i*47-time*speed*0.1)%(W+40)-20;
x.beginPath();
x.moveTo(gx,gy+10);
x.lineTo(gx+2,gy+2);
x.stroke();
}
// موانع
obs.forEach(function(o){
x.font='40px Tahoma';
x.textAlign='center';
x.textBaseline='middle';
x.fillText(o.t,o.x+o.w/2,o.y+o.h/2);
});
// سایه بز
x.fillStyle='rgba(0,0,0,.15)';
x.beginPath();
x.ellipse(92,gy+3,24,4,0,0,7);x.fill();
drawGoat(70,goat.y);
}

function drawGoat(px,py){
x.save();
x.translate(px,py);
// بدن
x.fillStyle='#ffffff';
x.beginPath();
x.ellipse(22,18,22,14,0,0,7);x.fill();
// پاها
x.fillStyle='#dddddd';
var lo=goat.onG?Math.sin(time*0.5)*4:0;
x.fillRect(8,28,5,14+lo);
x.fillRect(18,28,5,14-lo);
x.fillRect(28,28,5,14-lo);
x.fillRect(38,28,5,14+lo);
// سر
x.fillStyle='#f5f5f5';
x.beginPath();
x.ellipse(48,14,10,9,0,0,7);x.fill();
// شاخ
x.fillStyle='#7a5c3a';
x.beginPath();
x.moveTo(44,6);x.lineTo(45,-2);x.lineTo(48,6);
x.closePath();x.fill();
x.beginPath();
x.moveTo(52,6);x.lineTo(53,-2);x.lineTo(56,6);
x.closePath();x.fill();
// گوش
x.fillStyle='#dddddd';
x.beginPath();
x.ellipse(42,10,3,4.5,-0.4,0,7);x.fill();
// چشم
x.fillStyle='#000';
x.beginPath();x.arc(50,13,2.2,0,7);x.fill();
x.fillStyle='#fff';
x.beginPath();x.arc(50.6,12.4,0.8,0,7);x.fill();
// پوزه
x.fillStyle='#ffb8b8';
x.beginPath();x.arc(56,17,2,0,7);x.fill();
// دم
x.strokeStyle='#ffffff';
x.lineWidth=4;x.lineCap='round';
x.beginPath();
x.moveTo(2,16);
x.quadraticCurveTo(-6,12,-2,22);
x.stroke();
x.restore();
}

window.addEventListener('resize',function(){
W=c.width=innerWidth;H=c.height=innerHeight;gy=H*0.75;
});

// تنظیم دکمه صدا
document.getElementById('mute').textContent=soundOn?'🔊':'🔇';

// شروع
init();
loop();
</script>
</body>
</html>
