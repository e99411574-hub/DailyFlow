<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🐐 بز ماجراجو</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;font-family:Tahoma,sans-serif;background:#87ceeb;touch-action:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;position:fixed;top:0;left:0}
#hud{position:fixed;top:0;left:0;right:0;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:700;font-size:18px;text-shadow:0 2px 6px rgba(0,0,0,.5);z-index:5;padding-top:calc(14px + env(safe-area-inset-top))}
#hud .left{display:flex;align-items:center;gap:12px}
#hud .right{display:flex;align-items:center;gap:12px}
#mute{background:rgba(0,0,0,.3);border:none;color:#fff;font-size:18px;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
#mute:active{transform:scale(.9)}
#hearts{font-size:22px;letter-spacing:2px}
#hint{position:fixed;bottom:80px;left:0;right:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;opacity:.95;z-index:5}
#worldName{position:fixed;top:70px;left:0;right:0;text-align:center;color:#fff;font-size:14px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.6);z-index:5;opacity:0;transition:opacity .5s}
#worldName.show{opacity:1}
#over{position:fixed;inset:0;background:rgba(15,23,42,.92);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:20;padding:24px;text-align:center}
#over.on{display:flex}
#over h1{font-size:32px;margin-bottom:16px}
#over .big{font-size:52px;font-weight:800;color:#fbbf24;margin:12px 0}
#over p{font-size:15px;color:#cbd5e1;margin:4px 0}
#over .stats{display:flex;gap:24px;margin-top:20px;font-size:14px;color:#94a3b8}
#over .stats b{display:block;color:#fbbf24;font-size:22px;margin-top:4px}
#over button{margin-top:32px;padding:16px 52px;border:none;border-radius:18px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(16,185,129,.5)}
#over button:active{transform:scale(.95)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<div class="left">
<button id="mute" onclick="toggleMute()">🔊</button>
<div id="hearts">❤️❤️❤️</div>
</div>
<div class="right">
<div>🪙 <span id="coins">۰</span></div>
<div>🏆 <span id="sc">۰</span></div>
</div>
</div>
<div id="worldName"></div>
<div id="hint">👆 لمس کن تا بز بپره</div>
<div id="over">
<h1>🎯 بازی تمام</h1>
<div class="big"><span id="fs">۰</span></div>
<p>امتیاز نهایی</p>
<div class="stats">
<div>رکورد<b id="fb">۰</b></div>
<div>سکه‌ها<b id="fc">۰</b></div>
</div>
<button onclick="start()">🔄 دوباره</button>
</div>

<script>
var c=document.getElementById('c'),x=c.getContext('2d');
var W,H,gy,goat,obs,coins,powers,dist,speed,run,time,tick,world,worldStart,lives,inv,worldMsgTimer;
var totalCoins=parseInt(localStorage.getItem('goatCoins')||'0');
var best=parseInt(localStorage.getItem('goatBest3')||'0');

// ===== ۴ دنیا =====
var WORLDS=[
{n:'🌾 دشت سرسبز',c1:'#87ceeb',c2:'#c8e6f5',g1:'#5cb85c',g2:'#3d8550',mount:'#8fa8b8',len:400,obs:['🌵','🪨','🌳','🚧'],speed:1},
{n:'🌲 جنگل انبوه',c1:'#4a7c59',c2:'#8fb996',g1:'#3d6b47',g2:'#2c5035',mount:'#2a4a3a',len:800,obs:['🌳','🪵','🍄','🪨'],speed:1.15},
{n:'🏜 بیابان داغ',c1:'#f4a460',c2:'#ffe4b5',g1:'#d2b48c',g2:'#a0845c',mount:'#b08860',len:1200,obs:['🌵','💀','🪨','🐍'],speed:1.3},
{n:'🌌 فضا',c1:'#0a0a1a',c2:'#1a0a2a',g1:'#2a1040',g2:'#1a0a2a',mount:'#3a2050',len:1600,obs:['☄️','⭐','🛸','🌟'],speed:1.5}
];

// ===== صدا =====
var audioCtx=null;
var soundOn=localStorage.getItem('goatSound2')!=='off';
function initAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function beep(f,d,t,v){
if(!soundOn)return;
try{
initAudio();if(!audioCtx)return;
var o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.connect(g);g.connect(audioCtx.destination);
o.type=t||'sine';
var n=audioCtx.currentTime;
o.frequency.setValueAtTime(f,n);
g.gain.setValueAtTime(v||0.08,n);
g.gain.exponentialRampToValueAtTime(0.001,n+d);
o.start(n);o.stop(n+d);
}catch(e){}
}
function sndJump(){beep(500,0.1,'sine',0.1)}
function sndDouble(){beep(800,0.12,'sine',0.1)}
function sndHit(){beep(150,0.4,'sawtooth',0.15)}
function sndCoin(){beep(1200,0.08,'sine',0.08);setTimeout(function(){beep(1600,0.1,'sine',0.08)},50)}
function sndPower(){beep(660,0.1,'sine',0.1);setTimeout(function(){beep(990,0.1,'sine',0.1)},60);setTimeout(function(){beep(1320,0.15,'sine',0.1)},120)}
function sndWorld(){beep(523,0.15,'sine',0.1);setTimeout(function(){beep(659,0.15,'sine',0.1)},100);setTimeout(function(){beep(784,0.2,'sine',0.1)},200)}

function toggleMute(){
soundOn=!soundOn;
localStorage.setItem('goatSound2',soundOn?'on':'off');
document.getElementById('mute').textContent=soundOn?'🔊':'🔇';
if(soundOn)beep(880,0.1,'sine',0.1);
}

function updHearts(){
var s='';
for(var i=0;i<lives;i++)s+='❤️';
for(var j=lives;j<3;j++)s+='🖤';
document.getElementById('hearts').textContent=s;
}

function init(){
W=c.width=innerWidth;H=c.height=innerHeight;gy=H*0.78;
goat={y:gy-40,vy:0,onG:true,jumps:0};
obs=[];coins=[];powers=[];
dist=0;speed=5;time=0;tick=0;world=0;worldStart=0;lives=3;inv=0;
document.getElementById('over').classList.remove('on');
document.getElementById('hint').style.display='block';
setTimeout(function(){document.getElementById('hint').style.display='none'},3500);
document.getElementById('sc').textContent='۰';
document.getElementById('coins').textContent='۰';
updHearts();
run=true;
}

function start(){initAudio();init();loop()}

function jump(){
if(!run)return;
if(goat.onG){goat.vy=-15;goat.onG=false;goat.jumps=1;sndJump()}
else if(goat.jumps===1){goat.vy=-12;goat.jumps=2;sndDouble()}
}

c.addEventListener('touchstart',function(e){e.preventDefault();jump()});
c.addEventListener('mousedown',function(e){e.preventDefault();jump()});

function loop(){
if(!run)return;
upd();draw();
requestAnimationFrame(loop);
}

var lastScore=0;
function upd(){
time++;
var w=WORLDS[world];
// تغییر دنیا
if(dist-worldStart>w.len){
if(world<WORLDS.length-1){world++;worldStart=dist;showWorldName(WORLDS[world].n);sndWorld()}
else{worldStart=dist}
}
var cw=WORLDS[world];
speed=(5+world*0.7+Math.min(time/300,3))*cw.speed;
dist+=speed*0.1;
// فیزیک بز
goat.vy+=0.8;
goat.y+=goat.vy;
if(goat.y>=gy-40){goat.y=gy-40;goat.vy=0;goat.onG=true;goat.jumps=0}
if(inv>0)inv--;
// تولید موانع
tick--;
if(tick<=0){
tick=Math.max(70-time/60,40)+Math.random()*25;
spawnObs(cw);
}
// تولید سکه
if(Math.random()<0.05){
coins.push({x:W+30,y:gy-70-Math.random()*60,r:0,got:false});
}
// تولید قدرت
if(Math.random()<0.008){
var types=['shield','life'];
powers.push({x:W+50,y:gy-90-Math.random()*50,type:types[Math.floor(Math.random()*types.length)],r:0,got:false});
}
// حرکت
obs.forEach(function(o){o.x-=speed});
coins.forEach(function(o){o.x-=speed;o.r+=0.1});
powers.forEach(function(o){o.x-=speed;o.r+=0.1});
obs=obs.filter(function(o){return o.x+o.w>-60});
coins=coins.filter(function(o){return o.x>-40&&!o.got});
powers=powers.filter(function(o){return o.x>-40&&!o.got});
// برخورد با موانع
var bx=70,by=goat.y,bw=44,bh=36;
if(inv<=0){
for(var i=0;i<obs.length;i++){
var o=obs[i];
if(bx+bw-8>o.x&&bx+8<o.x+o.w&&by+bh-6>o.y&&by+6<o.y+o.h){
lives--;
inv=120;
updHearts();
sndHit();
if(lives<=0){gameOver();return}
break;
}
}
}
// برداشتن سکه
coins.forEach(function(o){
if(!o.got&&Math.abs(o.x-(bx+bw/2))<30&&Math.abs(o.y-(by+bh/2))<40){
o.got=true;
totalCoins++;
localStorage.setItem('goatCoins',totalCoins);
document.getElementById('coins').textContent=totalCoins.toLocaleString('fa-IR');
sndCoin();
}
});
// برداشتن قدرت
powers.forEach(function(o){
if(!o.got&&Math.abs(o.x-(bx+bw/2))<35&&Math.abs(o.y-(by+bh/2))<45){
o.got=true;
if(o.type==='life'&&lives<3){lives++;updHearts()}
else if(o.type==='life'&&lives===3){totalCoins+=5;localStorage.setItem('goatCoins',totalCoins);document.getElementById('coins').textContent=totalCoins.toLocaleString('fa-IR')}
else if(o.type==='shield'){inv=Math.max(inv,180)}
sndPower();
}
});
// صدا هر ۱۰۰ متر
var cur100=Math.floor(dist/100);
if(cur100>lastScore){lastScore=cur100;if(cur100>0)beep(880,0.08,'sine',0.08)}
document.getElementById('sc').textContent=Math.floor(dist).toLocaleString('fa-IR');
}

function showWorldName(n){
var el=document.getElementById('worldName');
el.textContent=n;
el.classList.add('show');
clearTimeout(worldMsgTimer);
worldMsgTimer=setTimeout(function(){el.classList.remove('show')},2000);
}

function spawnObs(w){
var t=w.obs[Math.floor(Math.random()*w.obs.length)];
var h=45+Math.random()*25;
var ww=42+Math.random()*15;
var air=['☄️','⭐','🛸','🌟'].indexOf(t)>=0;
var y=air?gy-70-Math.random()*50:gy-h;
obs.push({x:W+30,y:y,w:ww,h:h,t:t});
}

function gameOver(){
run=false;
sndHit();
if(dist>best){best=Math.floor(dist);localStorage.setItem('goatBest3',best)}
document.getElementById('fs').textContent=Math.floor(dist).toLocaleString('fa-IR');
document.getElementById('fb').textContent=best.toLocaleString('fa-IR');
document.getElementById('fc').textContent=totalCoins.toLocaleString('fa-IR');
document.getElementById('over').classList.add('on');
lastScore=0;
}

function draw(){
var w=WORLDS[world];
// آسمان
var g=x.createLinearGradient(0,0,0,gy);
g.addColorStop(0,w.c1);
g.addColorStop(1,w.c2);
x.fillStyle=g;x.fillRect(0,0,W,gy);
// پس‌زمینه خاص هر دنیا
if(world===3){
// فضا - ستاره
for(var i=0;i<80;i++){
var sx=(i*53.7+time*0.1)%W;
var sy=(i*37.3)%(gy-100);
x.fillStyle='rgba(255,255,255,'+(0.4+(i%5)*0.12)+')';
x.beginPath();x.arc(sx,sy,1+(i%3)*0.5,0,7);x.fill();
}
// سیاره
x.fillStyle='rgba(150,80,200,.35)';
x.beginPath();x.arc(W*0.8,120,50,0,7);x.fill();
x.fillStyle='rgba(80,150,255,.3)';
x.beginPath();x.arc(W*0.2,180,35,0,7);x.fill();
}else{
// خورشید
x.fillStyle='#ffd93b';
x.shadowColor='#ffd93b';x.shadowBlur=40;
x.beginPath();x.arc(W*0.85,90,42,0,7);x.fill();
x.shadowBlur=0;
// ابر
x.fillStyle='rgba(255,255,255,.85)';
for(var k=0;k<4;k++){
var cx=((k*280+time*0.5)%(W+200))-100;
var cy=80+k*55;
x.beginPath();
x.arc(cx,cy,28,0,7);
x.arc(cx+32,cy-8,24,0,7);
x.arc(cx-30,cy-4,22,0,7);
x.arc(cx+10,cy-22,18,0,7);
x.fill();
}
}
// کوه‌ها
x.fillStyle=w.mount;
x.beginPath();x.moveTo(0,gy);
for(var m=0;m<=W;m+=40){
x.lineTo(m,gy-70-Math.sin(m*0.008+world)*35);
}
x.lineTo(W,gy);x.closePath();x.fill();
// زمین با گرادینت
var gg=x.createLinearGradient(0,gy,0,H);
gg.addColorStop(0,w.g1);
gg.addColorStop(1,w.g2);
x.fillStyle=gg;x.fillRect(0,gy,W,H-gy);
x.fillStyle='rgba(0,0,0,.15)';
x.fillRect(0,gy,W,4);
// علف‌های متحرک
x.strokeStyle=w.g2;
x.lineWidth=2;
for(var i=0;i<35;i++){
var gx=(i*47-time*speed*0.3)%(W+40)-20;
x.beginPath();
x.moveTo(gx,gy+12);
x.lineTo(gx+2,gy+3);
x.stroke();
}
// سکه‌ها
coins.forEach(function(o){
if(o.got)return;
x.save();
x.translate(o.x,o.y);
x.scale(Math.abs(Math.cos(o.r))+0.3,1);
x.fillStyle='#ffd700';
x.shadowColor='#ffd700';x.shadowBlur=15;
x.beginPath();x.arc(0,0,14,0,7);x.fill();
x.shadowBlur=0;
x.fillStyle='#b8860b';
x.font='bold 18px Tahoma';
x.textAlign='center';x.textBaseline='middle';
x.fillText('$',0,1);
x.restore();
});
// قدرت‌ها
powers.forEach(function(o){
if(o.got)return;
x.save();
x.translate(o.x,o.y+Math.sin(time*0.1)*5);
x.fillStyle='rgba(255,255,255,.95)';
x.shadowColor='#fbbf24';x.shadowBlur=20;
x.beginPath();x.arc(0,0,20,0,7);x.fill();
x.shadowBlur=0;
x.font='24px Tahoma';
x.textAlign='center';x.textBaseline='middle';
x.fillText(o.type==='life'?'💚':'⭐',0,1);
x.restore();
});
// موانع
obs.forEach(function(o){
x.save();
x.font='42px Tahoma';
x.textAlign='center';
x.textBaseline='middle';
x.shadowColor='rgba(0,0,0,.3)';
x.shadowBlur=8;
x.shadowOffsetY=4;
x.fillText(o.t,o.x+o.w/2,o.y+o.h/2);
x.restore();
});
// سایه بز
x.fillStyle='rgba(0,0,0,.15)';
x.beginPath();
x.ellipse(92,gy+4,26,5,0,0,7);x.fill();
// بز (با محافظ)
drawGoat(70,goat.y,inv>0&&Math.floor(inv/8)%2===0);
}

function drawGoat(px,py,showShield){
// هاله محافظ
if(inv>0&&!showShield){
x.strokeStyle='rgba(251,191,36,.6)';
x.lineWidth=4;
x.beginPath();
x.arc(px+22,py+18,45,0,7);
x.stroke();
}
if(showShield)return;
x.save();
x.translate(px,py);
// بدن با سایه
x.fillStyle='#f0f0f0';
x.beginPath();
x.ellipse(22,18,22,14,0,0,7);x.fill();
x.fillStyle='rgba(0,0,0,.08)';
x.beginPath();
x.ellipse(22,26,22,7,0,0,7);x.fill();
// پاها
x.fillStyle='#d8d8d8';
var lo=goat.onG?Math.sin(time*0.5)*4:0;
x.fillRect(8,28,5,14+lo);
x.fillRect(18,28,5,14-lo);
x.fillRect(28,28,5,14-lo);
x.fillRect(38,28,5,14+lo);
x.fillStyle='#3a3a3a';
x.fillRect(8,40+lo,5,4);
x.fillRect(18,40-lo,5,4);
x.fillRect(28,40-lo,5,4);
x.fillRect(38,40+lo,5,4);
// سر
x.fillStyle='#f5f5f5';
x.beginPath();
x.ellipse(48,14,10,9,0,0,7);x.fill();
// شاخ
x.fillStyle='#7a5c3a';
x.beginPath();
x.moveTo(44,6);x.lineTo(45,-3);x.lineTo(48,6);
x.closePath();x.fill();
x.beginPath();
x.moveTo(52,6);x.lineTo(53,-3);x.lineTo(56,6);
x.closePath();x.fill();
// گوش
x.fillStyle='#d8d8d8';
x.beginPath();
x.ellipse(42,10,3,4.5,-0.4,0,7);x.fill();
// چشم
x.fillStyle='#1a1a1a';
x.beginPath();x.arc(50,13,2.2,0,7);x.fill();
x.fillStyle='#fff';
x.beginPath();x.arc(50.6,12.4,0.8,0,7);x.fill();
// پوزه
x.fillStyle='#ffb8b8';
x.beginPath();x.arc(56,17,2.2,0,7);x.fill();
// دم کوچک
x.strokeStyle='#f0f0f0';
x.lineWidth=4;x.lineCap='round';
x.beginPath();
x.moveTo(2,16);
x.quadraticCurveTo(-6,12,-2,22);
x.stroke();
x.restore();
}

window.addEventListener('resize',function(){
W=c.width=innerWidth;H=c.height=innerHeight;gy=H*0.78;
});

document.getElementById('mute').textContent=soundOn?'🔊':'🔇';
init();
loop();
</script>
</body>
</html>
