<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<title>پرسش و پاسخ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#1e293b;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:10;padding-top:calc(14px + env(safe-area-inset-top))}
.hdr h1{font-size:17px;font-weight:700}
.ibtn{background:none;border:none;color:#f1f5f9;font-size:20px;cursor:pointer;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ibtn:active{background:rgba(255,255,255,.08)}
.wrap{padding:16px;max-width:600px;margin:0 auto}
.search{width:100%;padding:13px 16px;font-size:14px;font-family:inherit;background:#1e293b;color:#f1f5f9;border:2px solid rgba(255,255,255,.08);border-radius:14px;outline:none;margin-bottom:14px}
.search:focus{border-color:#818cf8}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat-card{background:#1e293b;border-radius:16px;padding:18px 14px;cursor:pointer;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;gap:10px}
.cat-card:active{transform:scale(.96);background:rgba(99,102,241,.15)}
.cat-card .ic{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px}
.cat-card .nm{font-size:13px;font-weight:700;text-align:center;line-height:1.4}
.cat-card .ct{font-size:10px;color:#94a3b8}
.cat-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;background:#1e293b;padding:14px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.08)}
.cat-hdr .ic{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.cat-hdr .info{flex:1}
.cat-hdr .nm{font-size:15px;font-weight:700}
.cat-hdr .ct{font-size:11px;color:#94a3b8;margin-top:2px}
.q{background:#1e293b;border-radius:14px;margin-bottom:10px;border:1px solid rgba(255,255,255,.08);overflow:hidden}
.q-head{padding:15px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
.q-head:active{background:rgba(255,255,255,.03)}
.q-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.q-title{flex:1;font-size:13.5px;font-weight:600;line-height:1.5}
.q-arrow{font-size:13px;color:#64748b;transition:transform .3s}
.q.open .q-arrow{transform:rotate(180deg)}
.q-body{max-height:0;overflow:hidden;transition:max-height .5s ease;background:rgba(0,0,0,.15)}
.q.open .q-body{max-height:2000px}
.q-answer{padding:14px 16px 16px;font-size:13px;line-height:2;color:#cbd5e1;border-top:1px solid rgba(255,255,255,.05);white-space:pre-line}
.q-answer b{color:#a5b4fc}
.back-btn{background:none;border:none;color:#818cf8;font-size:13px;font-weight:600;font-family:inherit;padding:8px 0;margin-bottom:8px;cursor:pointer}
.empty{text-align:center;padding:40px 20px;color:#64748b;font-size:13px}
.hidden{display:none}
</style>
</head>

// ====== پرسش و پاسخ‌ها ======
// برای اضافه کردن سوال جدید، این الگو رو کپی کن:
// {c:'شناسه دسته',ic:'ایموجی',q:'سوال؟',a:'جواب...'},
var QA=[

// ===== تغذیه =====
{c:'food',ic:'🍊',q:'خواص پرتقال چیست؟',a:'• سرشار از ویتامین C\n• فیبر بالا\n• پتاسیم — تنظیم فشار خون\n• فولات — مفید بارداری\n• آنتی‌اکسیدان — ضد پیری\n• کمک به جذب آهن\n\n💡 روزانه یک عدد کافیه.'},
{c:'food',ic:'🍎',q:'خواص سیب چیست؟',a:'• فیبر پکتین — کاهش کلسترول\n• آنتی‌اکسیدان\n• کمک به کاهش وزن\n• سلامت روده\n• کاهش خطر دیابت نوع ۲\n• سلامت دندان\n\n💡 با پوست بخور، خواصش بیشتره.'},
{c:'food',ic:'🍌',q:'خواص موز چیست؟',a:'• پتاسیم — تقویت عضلات\n• انرژی سریع — قبل ورزش\n• تریپتوفان — بهبود خلق\n• ویتامین B6 — سلامت مغز\n• کمک به هضم\n• تنظیم فشار خون\n\n⚠️ دیابتی‌ها با احتیاط.'},
{c:'food',ic:'🌰',q:'خواص خرما چیست؟',a:'• انرژی بالا\n• فیبر — کمک گوارش\n• آهن — مفید کم‌خونی\n• پتاسیم — سلامت قلب\n• قند طبیعی\n• آنتی‌اکسیدان\n\n💡 روزانه ۳ تا ۵ عدد.'},
{c:'food',ic:'🍇',q:'خواص انار چیست؟',a:'• آنتی‌اکسیدان قوی\n• سلامت قلب\n• کاهش التهاب\n• تقویت حافظه\n• سلامت پوست\n• کاهش فشار خون\n\n💡 صبح ناشتا بهترین زمانه.'},
{c:'food',ic:'🥬',q:'خواص اسفناج چیست؟',a:'• آهن بالا — رفع کم‌خونی\n• ویتامین K — سلامت استخوان\n• فولات — سلامت مغز\n• آنتی‌اکسیدان\n• ویتامین A — سلامت چشم\n\n⚠️ سنگ کلیه دارها با احتیاط.'},
{c:'food',ic:'🥕',q:'خواص هویج چیست؟',a:'• بتاکاروتن — سلامت چشم\n• آنتی‌اکسیدان\n• فیبر — کاهش کلسترول\n• سلامت پوست\n• تقویت ایمنی\n\n💡 با چربی سالم بخور.'},
{c:'food',ic:'🧄',q:'خواص سیر چیست؟',a:'• ضد باکتری و ویروس\n• کاهش فشار خون\n• کاهش کلسترول\n• تقویت ایمنی\n• ضد التهاب\n• سلامت قلب\n\n💡 ناشتا: یک حبه.'},
{c:'food',ic:'💧',q:'چرا باید آب کافی بخوریم؟',a:'• سلامت پوست\n• کمک گوارش\n• دفع سموم\n• تنظیم دمای بدن\n• تقویت تمرکز\n• کاهش سردرد\n\n💡 روزانه ۶–۸ لیوان.'},
{c:'food',ic:'🍯',q:'خواص عسل طبیعی چیست؟',a:'• ضد باکتری\n• تسکین گلودرد\n• رفع سرفه\n• تقویت ایمنی\n• بهبود زخم\n• انرژی‌بخش\n\n⚠️ زیر ۱ سال نباید بخورن.'},

// ===== لباس =====
{c:'cloth',ic:'🧵',q:'انواع پارچه کدامند؟',a:'🌿 <b>نخ</b> — خنک، تابستان\n🐑 <b>پشم</b> — گرم، زمستان\n🐛 <b>ابریشم</b> — براق، لوکس\n🌾 <b>کتان</b> — خنک، محکم\n\nمصنوعی:\n• پلی‌استر — ارزان\n• نایلون — ضد آب\n• اسپندکس — کشی\n\n💡 تابستان نخ، زمستان پشم.'},
{c:'cloth',ic:'🧥',q:'لباس مناسب هر فصل؟',a:'بهار: مانتو سبک، کاپشن نازک\nتابستان: نخ، رنگ روشن، کلاه\nپاییز: کاپشن، پلیور\nزمستان: پالتو، شال، کلاه، دستکش\n\n💡 لایه‌لایه بهتره — کم و زیاد کن.'},
{c:'cloth',ic:'👔',q:'انواع کراوات و گره؟',a:'انواع:\n• ساده — رسمی\n• راه‌راه — نیمه‌رسمی\n• پلاک‌دار — اسپرت\n\nگره‌ها:\n• Four-in-Hand — ساده\n• وینزر — رسمی\n• نیمه‌وینزر — پرکاربرد\n• پرات — قرینه\n\n💡 طول کراوات تا کمربند.'},
{c:'cloth',ic:'👞',q:'انواع کفش مردانه؟',a:'👟 اسپرت — روزمره\n👞 آکسفورد — رسمی‌ترین\n👞 دربی — نیمه‌رسمی\n👞 لوفر — بدون بند\n🥾 بوت — چرمی/کارگری\n\n💡 جوراب هم‌رنگ شلوار، نه کفش.'},
{c:'cloth',ic:'🧼',q:'چطور لباس‌ها رو بشوریم؟',a:'سرد (۳۰°): رنگی، ابریشم، پشم\nولرم (۴۰°): معمولی\nگرم (۶۰°+): حوله، ملافه\n\nنکات:\n• رنگی جدا از سفید\n• لباس نو اول جدا\n• جیب‌ها خالی\n• زیپ‌ها بسته\n\n💡 برچسب لباس رو بخون.'},
{c:'cloth',ic:'👗',q:'انواع مانتو و استایل زنانه؟',a:'انواع:\n• کوتاه/بلند\n• تابستانه/زمستانه\n• مجلسی/اسپرت\n\nرنگ‌ها:\n• مشکی — همه‌کاره\n• سرمه‌ای — شیک\n• خاکی — روزمره\n\n💡 سادگی شیک‌تر از شلوغیه.'},
{c:'cloth',ic:'🧦',q:'راهنمای سایز لباس؟',a:'👕 S — ۳۶-۳۸\n👕 M — ۳۸-۴۰\n👕 L — ۴۰-۴۲\n👕 XL — ۴۲-۴۴\n\n👖 شلوار:\n۲۸-۳۰ کوچیک\n۳۲-۳۴ متوسط\n۳۶-۳۸ بزرگ\n\n💡 همیشه اندازه بگیر.'},
{c:'cloth',ic:'🎩',q:'انواع کلاه و کاربرد؟',a:'🎩 لبه‌دار — آفتاب\n🧢 کپ — اسپرت\n👒 حصیری — ساحلی\n🎿 بافتنی — زمستان\n👷 ایمنی — کارگاهی\n\n💡 برای آفتاب، روشن و لبه‌پهن.'},
{c:'cloth',ic:'🧤',q:'چطور از لباس‌هام نگهداری کنم؟',a:'• چوب‌لباسی مناسب\n• کفش در جاکفشی\n• قالب کفش چرمی\n• لباس زمستانی در وکیوم\n• نعناع خشک برای موش\n\n💡 کمد رو هر فصل مرتب کن.'},
{c:'cloth',ic:'🛍',q:'چطور لباس هوشمندانه بخریم؟',a:'• لیست بنویس\n• کیفیت مهم‌تر از قیمت\n• هماهنگی با لباس‌های موجود\n• فصل رو در نظر بگیر\n• سایز دقیق بپوش\n\n💡 مشکی و سرمه‌ای همیشه کاربرد دارن.'},

// ===== آب و هوا =====
{c:'weather',ic:'🌤',q:'انواع آب و هوا کدامند؟',a:'🌴 گرمسیری — باران زیاد\n🏜 بیابانی — خشک\n❄️ قطبی — برف همیشگی\n🌤 معتدل — چهار فصل\n🌊 مدیترانه‌ای — تابستان خشک\n\n💡 هر اقلیم، سبک زندگی خودش رو داره.'},
{c:'weather',ic:'☁️',q:'انواع ابر کدامند؟',a:'☁️ کومولوس — پنبه‌ای، هوای خوب\n🌫 استراتوس — لایه‌ای، پوشیده\n☁️ سیروس — نازک، بلند\n⛈ کومولونیمبوس — طوفانی\n🌧 نیمبواستراتوس — باران ملایم\n\n💡 کومولونیمبوس نشانهٔ طوفانه.'},
{c:'weather',ic:'🌧',q:'انواع بارش کدامند؟',a:'🌧 باران — قطرات آب\n❄️ برف — بلور یخ\n🌨 تگرگ — گلوله یخ\n🌫 باران‌ریز — قطرات ریز\n💧 شبنم — صبح زود\n🌫 مه — بخار معلق\n\n💡 بارش با میلی‌متر اندازه‌گیری می‌شه.'},
{c:'weather',ic:'💨',q:'انواع باد کدامند؟',a:'جهانی:\n• موسمی — فصلی\n• تجارتی — شرق به غرب\n• غربی — عرض میانه\n\nمحلی:\n• شمال — سرد\n• جنوب — گرم\n• صبا — بهاری\n• سموم — سوزان\n\n💡 باد شدید منشأ طوفانه.'},
{c:'weather',ic:'🌡',q:'چطور دما اندازه‌گیری می‌شه؟',a:'واحدها:\n• سلسیوس (°C) — ایران\n• فارنهایت (°F) — آمریکا\n• کلوین (K) — علمی\n\nتبدیل:\n°C × ۱.۸ + ۳۲ = °F\n\nنکات:\n• ۰°C = یخ\n• ۱۰۰°C = جوش\n• ۳۷°C = بدن'},
{c:'weather',ic:'🌈',q:'رنگین‌کمان چطور ساخته می‌شه؟',a:'نور خورشید + قطرات باران = تجزیهٔ نور\n\nرنگ‌ها (بیرون به داخل):\n🔴 قرمز → 🟠 نارنجی → 🟡 زرد → 🟢 سبز → 🔵 آبی → 🟣 بنفش\n\nشرایط: باران + آفتاب همزمان'},
{c:'weather',ic:'⛈',q:'چرا رعد و برق می‌زنه؟',a:'ترکیب ابرهای بارانی + باد = بار الکتریکی\n\n• صاعقه: ۳۰,۰۰۰°C\n• سرعت: ۱۰۰,۰۰۰ km/s\n\nایمنی:\n• داخل ساختمان برو\n• زیر درخت نایست\n• از آب دوری کن'},
{c:'weather',ic:'❄️',q:'چرا برف سفیده؟',a:'بلورهای یخ، نور همهٔ رنگ‌ها رو بازتاب می‌دن → چشم سفید می‌بینه\n\nحقایق:\n• هیچ دو بلور شبیه هم نیستن\n• هر بلور ۶ ضلعی\n• بزرگ‌ترین دانه: ۳۸ سانتی‌متر'},
{c:'weather',ic:'🌪',q:'طوفان‌ها چطور شکل می‌گیرن؟',a:'🌪 تورنادو — قیف چرخان، ۵۰۰ km/h\n🌀 هاریکن — مناطق گرمسیری، ۲۵۰ km/h\n🌊 سونامی — موج عظیم از زلزله\n\nمقیاس:\n• تورنادو: EF0 تا EF5\n• هاریکن: ۱ تا ۵'},
{c:'weather',ic:'🔆',q:'چرا آسمان آبیه؟',a:'نور خورشید با مولکول‌های هوا برخورد می‌کنه و پراکنده می‌شه.\n\nرنگ آبی بیشتر پراکنده می‌شه (پراکندگی ریلی).\n\nغروب: نور مسیر طولانی‌تری طی می‌کنه → قرمز/نارنجی'},

// ===== دانشمندان =====
{c:'sci',ic:'🧪',q:'ابن‌سینا چه کارهایی کرد؟',a:'(۹۸۰-۱۰۳۷ م)\n\n👨‍⚕️ پزشک — کتاب «قانون»\n🧠 فیلسوف — کتاب «شفا»\n📚 حدود ۴۵۰ کتاب\n\n• در ۱۸ سالگی پزشک ماهر\n• «پدر پزشکی مدرن»'},
{c:'sci',ic:'🔭',q:'خوارزمی چه کشفیاتی داشت؟',a:'(۷۸۰-۸۵۰ م)\n\n• بنیان‌گذار جبر\n• ابداع الگوریتم (از نامش)\n• معرفی اعداد هندی-عربی\n\n💡 کلمه «Algorithm» از نامش گرفته شده.'},
{c:'sci',ic:'💡',q:'ادیسون چه اختراعاتی داشت؟',a:'(۱۸۴۷-۱۹۳۱)\n\n💡 لامپ برق\n🎙 گرامافون\n🎬 دوربین فیلم\n🔋 باتری\n\n• ۱,۰۹۳ اختراع ثبت‌شده\n• «نبوغ ۱٪ الهام و ۹۹٪ تلاش»'},
{c:'sci',ic:'🌌',q:'انیشتین چه کشفیاتی داشت؟',a:'(۱۸۷۹-۱۹۵۵)\n\n⚡ نسبیت خاص — E=mc²\n🌌 نسبیت عام — جاذبه\n🏆 نوبل ۱۹۲۱\n\n💡 بدون انیشتین، GPS کار نمی‌کرد!'},
{c:'sci',ic:'🍎',q:'نیوتن چه کشفیاتی داشت؟',a:'(۱۶۴۳-۱۷۲۷)\n\n🍎 قانون جاذبه\n📐 قوانین حرکت (۳ قانون)\n🔬 اپتیک — تجزیهٔ نور\n\n💡 «اگر دورتر رو دیدم، چون روی شانهٔ غول‌ها ایستادم.»'},
{c:'sci',ic:'⚡',q:'تسلا چه کشفیاتی داشت؟',a:'(۱۸۵۶-۱۹۴۳)\n\n⚡ جریان متناوب (AC)\n📡 رادیو\n🌀 موتور القایی\n🔋 سیم‌پیچ تسلا\n\n• ۳۰۰+ اختراع\n• رقیب ادیسون'},
{c:'sci',ic:'📚',q:'بزرگ‌ترین دانشمندان ایرانی؟',a:'🧮 خوارزمی — جبر\n🩺 ابن‌سینا — پزشکی\n🔬 رازی — شیمی\n🌍 بیرونی — نجوم\n📖 خیام — ریاضی\n🧪 جابر بن حیان — شیمی\n🎓 فارابی — فلسفه\n🌟 خواجه نصیر — نجوم'},

// ===== رندر =====
var curCat=null;
document.getElementById('search').classList.add('hidden');

function goBack(){
if(curCat){
curCat=null;
document.getElementById('hdrTitle').textContent='📚 دایرة‌المعارف';
document.getElementById('search').classList.add('hidden');
document.getElementById('search').value='';
render();
}else{
location.href='index.html';
}
}

function render(){
var content=document.getElementById('content');
content.innerHTML='';
var q=document.getElementById('search').value.trim();

if(curCat){
var cat=CATS.find(function(c){return c.id===curCat});
if(!cat)return;
var hdr=document.createElement('div');hdr.className='cat-hdr';
var ic=document.createElement('div');ic.className='ic';ic.style.background=cat.g;ic.textContent=cat.ic;
var info=document.createElement('div');info.className='info';
var nm=document.createElement('div');nm.className='nm';nm.textContent=cat.nm;
var items=QA.filter(function(x){return x.c===curCat});
var ct=document.createElement('div');ct.className='ct';ct.textContent=items.length+' پرسش';
info.appendChild(nm);info.appendChild(ct);
hdr.appendChild(ic);hdr.appendChild(info);
content.appendChild(hdr);
var bb=document.createElement('button');bb.className='back-btn';bb.textContent='← بازگشت';bb.onclick=goBack;
content.appendChild(bb);
var filtered=items.filter(function(x){if(!q)return true;return x.q.indexOf(q)>=0||x.a.indexOf(q)>=0})
  filtered.forEach(function(item){content.appendChild(makeQ(item,cat.ic))});
return;
}

if(q){
document.getElementById('search').classList.remove('hidden');
var all=QA.filter(function(x){return x.q.indexOf(q)>=0||x.a.indexOf(q)>=0});
if(all.length===0){content.innerHTML='<div class="empty">چیزی پیدا نشد</div>';return}
all.forEach(function(item){
var cat=CATS.find(function(c){return c.id===item.c})||{ic:'📌'};
content.appendChild(makeQ(item,cat.ic));
});
return;
}

document.getElementById('search').classList.add('hidden');
var grid=document.createElement('div');grid.className='cat-grid';
CATS.forEach(function(cat){
var items=QA.filter(function(x){return x.c===cat.id});
var card=document.createElement('div');card.className='cat-card';
var ic=document.createElement('div');ic.className='ic';ic.style.background=cat.g;ic.textContent=cat.ic;
var nm=document.createElement('div');nm.className='nm';nm.textContent=cat.nm;
var ct=document.createElement('div');ct.className='ct';ct.textContent=items.length+' پرسش';
card.appendChild(ic);card.appendChild(nm);card.appendChild(ct);
card.onclick=function(){curCat=cat.id;document.getElementById('hdrTitle').textContent=cat.ic+' '+cat.nm;document.getElementById('search').classList.remove('hidden');render()};
grid.appendChild(card);
});
content.appendChild(grid);
}

function makeQ(item,catIc){
var d=document.createElement('div');d.className='q';
var h=document.createElement('div');h.className='q-head';
var ico=document.createElement('div');ico.className='q-icon';ico.textContent=item.ic||catIc||'📌';
var ti=document.createElement('div');ti.className='q-title';ti.textContent=item.q;
var ar=document.createElement('div');ar.className='q-arrow';ar.textContent='▼';
h.appendChild(ico);h.appendChild(ti);h.appendChild(ar);
var b=document.createElement('div');b.className='q-body';
var a=document.createElement('div');a.className='q-answer';a.innerHTML=item.a;
b.appendChild(a);
d.appendChild(h);d.appendChild(b);
h.onclick=function(){d.classList.toggle('open')};
return d;
}

render();
</script>
